services:
  ingest-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingest-api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
      - ./mappings:/app/mappings
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./mappings
          target: /app/mappings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

